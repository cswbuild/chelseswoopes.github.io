intro: >-
  I am a Ph.D. candidate in Computer Science at Harvard
  University, advised by Assistant Professor Elena Glassman
  in the Variation Lab. My research focuses on designing
  and evaluating interactive systems that support human
  sensemaking and judgment when working with AI. In
  particular, I investigate AI-resilient interfaces that
  help people notice, judge, and recover from potentially
  inappropriate AI behavior, including model errors and
  outputs that do not align with users' intentions.
  My work draws on theories of human cognition and concept
  learning and spans human-AI interaction, large language
  model interfaces, scientific communication, and legal
  reading and writing.

background: |
  Before Harvard, I worked as a Senior Systems Security
  Engineer at The Charles Stark Draper Laboratory, where
  I contributed to Department of Defense programs and led
  engineering teams. I hold an M.Sc. in Electrical
  Engineering from Carnegie Mellon University, where I
  conducted research in usable privacy and security with
  Professor Lorrie Cranor, and a B.Sc. in Mathematics
  from Mississippi State University.

  My work has been recognized with awards for research
  publications, engineering contributions, and professional
  leadership.

  I am on the academic job market for tenure-track
  faculty positions and am also open to aligned industry
  research opportunities.

  I welcome opportunities for research collaboration and
  professional engagement.
  <a href="mailto:cswoopes@g.harvard.edu">Contact me</a>
  to discuss research, potential collaborations, or
  employment opportunities.